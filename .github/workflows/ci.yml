name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
      NEO4J_DATABASE: neo4j
      RUN_NEO4J_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/generate_demo_data.py
      - run: git diff --exit-code -- data/sample/incidents.csv
      - run: uv run python -m defi_security run --profile demo
      - run: uv run pytest --cov=defi_security --cov-report=term-missing
      - run: uv run python scripts/check_readme_metrics.py
      - run: uv run pip-audit
      - run: uv build
