[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-security-knowledge-graph"
version = "1.0.0"
description = "Leakage-aware graph feature engineering for DeFi security incident severity analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Daria Pavlova", email = "daria.pavlova@mps.si" }]
keywords = ["defi", "knowledge-graph", "machine-learning", "cybersecurity", "neo4j"]
dependencies = [
  "lightgbm>=4.3,<5",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
graph = ["neo4j>=5.20,<6"]
dev = [
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
defi-security = "defi_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["neo4j: requires a running Neo4j instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["defi_security"]

[tool.coverage.report]
fail_under = 80
show_missing = true
